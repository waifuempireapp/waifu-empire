<!-- Splash mostrato SUBITO nell'HTML (prima che il bundle JS venga scaricato/parsato):
     niente più schermo bianco per decine di secondi su device lenti.
     STATICO (nessun fade-in/pulse/blink che ripartirebbe al passaggio alla fase
     dati → niente "flash"): l'unico movimento è lo spinner liscio in basso.
     Stessa grafica dell'AppLoading fullscreen → transizione invisibile.
     Solo CSS + immagini locali in /splash/ (rigenerabili con scripts/build-splash-cards.mjs). -->
<div class="iw-splash">
  <div class="iw-rays"></div>
  <div class="iw-cards">
    <img class="iw-c iw-c1"  src="/splash/card1.webp"  alt="" />
    <img class="iw-c iw-c2"  src="/splash/card2.webp"  alt="" />
    <img class="iw-c iw-c3"  src="/splash/card3.webp"  alt="" />
    <img class="iw-c iw-c4"  src="/splash/card4.webp"  alt="" />
    <img class="iw-c iw-c5"  src="/splash/card5.webp"  alt="" />
    <img class="iw-c iw-c6"  src="/splash/card6.webp"  alt="" />
    <img class="iw-c iw-c7"  src="/splash/card7.webp"  alt="" />
    <img class="iw-c iw-c8"  src="/splash/card8.webp"  alt="" />
    <img class="iw-c iw-c9"  src="/splash/card9.webp"  alt="" />
    <img class="iw-c iw-c10" src="/splash/card10.webp" alt="" />
  </div>
  <img class="iw-logo" src="/splash/logo.png" alt="Waifu Empire" />
  <div class="iw-spin"></div>
</div>
<style>
  .iw-splash{position:fixed;inset:0;overflow:hidden;z-index:2147483647;
    background:radial-gradient(circle at 50% 42%,#241548 0%,#140d2b 45%,#0b0818 100%);}
  /* Raggi "sunburst" STATICI (nessuna rotazione → niente flash) */
  .iw-rays{position:absolute;top:50%;left:50%;width:200vmax;height:200vmax;
    transform:translate(-50%,-50%);
    background:repeating-conic-gradient(from 0deg,
      rgba(167,139,250,0.09) 0deg 6deg, rgba(167,139,250,0) 6deg 12deg);
    -webkit-mask-image:radial-gradient(circle,#000 0%,#000 30%,transparent 62%);
            mask-image:radial-gradient(circle,#000 0%,#000 30%,transparent 62%);}
  .iw-cards{position:absolute;inset:0;}
  .iw-c{position:absolute;width:min(19vw,96px);border-radius:8px;
    box-shadow:0 6px 16px rgba(0,0,0,0.5);}
  .iw-c1 {left:5%;  top:9%;    transform:rotate(-12deg)}
  .iw-c2 {left:31%; top:3%;    transform:rotate(-5deg)}
  .iw-c3 {right:31%;top:4%;    transform:rotate(6deg)}
  .iw-c4 {right:4%; top:10%;   transform:rotate(13deg)}
  .iw-c5 {left:2%;  top:42%;   transform:rotate(-9deg)}
  .iw-c6 {right:2%; top:40%;   transform:rotate(9deg)}
  .iw-c7 {left:7%;  bottom:7%; transform:rotate(10deg)}
  .iw-c8 {left:33%; bottom:2%; transform:rotate(-6deg)}
  .iw-c9 {right:33%;bottom:3%; transform:rotate(7deg)}
  .iw-c10{right:6%; bottom:8%; transform:rotate(-12deg)}
  .iw-logo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    width:min(60vw,320px);filter:drop-shadow(0 6px 22px rgba(167,139,250,0.45));}
  /* Unico movimento: spinner liscio (ruota, non lampeggia) */
  .iw-spin{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);
    width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(167,139,250,0.22);border-top-color:#a78bfa;
    animation:iw-rot 0.9s linear infinite;}
  @keyframes iw-rot{to{transform:translateX(-50%) rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.iw-spin{animation-duration:1.6s}}
</style>
